# Reverse proxy for the production stack (docker-compose.prod.yml).
#
#   Internet -> [TLS terminator or load balancer] -> nginx :8080 -> web (Next.js) / api (FastAPI)
#
# nginx is the single public entry point. It listens on plain HTTP inside the private Docker
# network; TLS is terminated in front of it (a cloud load balancer, Caddy, Cloudflare) -- see
# docs/deployment/production.md. It trusts X-Forwarded-Proto only from that terminator.
#
# Same-origin routing means the browser needs no CORS and the web build uses one public origin:
#   /api/*  /ws/*  /health/*      -> api:8000
#   /metrics                      -> refused (scraped on the internal network only)
#   everything else               -> web:3000

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # One JSON line per request, carrying the id the API logs too (X-Request-ID), so a request can
    # be followed from the proxy into the API and on into any Celery task it enqueues.
    log_format json escape=json '{"ts":"$time_iso8601","service":"nginx","request_id":"$request_id",'
                    '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
                    '"bytes":$body_bytes_sent,"duration_ms":$request_time,"upstream_ms":"$upstream_response_time"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 1m;          # JSON API; uploads get their own limit below
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    # Coarse first line of defence; the API's Redis-backed limits are the precise ones.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=600r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Behind a TLS-terminating load balancer the original scheme arrives in X-Forwarded-Proto.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }
    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Never reachable from outside: Prometheus scrapes api:8000/metrics directly.
        location = /metrics { return 404; }

        location /ws/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            # The server drops a silent socket after 2 x the 30s heartbeat; stay above that.
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            limit_conn perip 50;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            include /etc/nginx/api_proxy.inc;
        }

        # Image uploads are the only large request bodies.
        location ~ ^/api/v1/editor/media {
            client_max_body_size 7m;
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/api_proxy.inc;
        }

        # Stripe-style webhooks: the signature, not the IP, authenticates them.
        location = /api/v1/billing/webhook {
            include /etc/nginx/api_proxy.inc;
        }

        location /api/ {
            limit_req zone=api burst=100 nodelay;
            include /etc/nginx/api_proxy.inc;
        }

        location /health/ {
            include /etc/nginx/api_proxy.inc;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrite, never append: a client-supplied X-Forwarded-For must not survive.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 30s;
        }
    }
}
