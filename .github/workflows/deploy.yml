name: Deploy

# Release train:  tag vX.Y.Z  ->  CI must already be green on that commit  ->  build + push images
#                 ->  staging (migrate, roll, smoke test)  ->  [manual approval]  ->  production (migrate, roll, smoke test).
#
# Production is never deployed automatically from a push: the `production` environment must be configured in
# GitHub with required reviewers (Settings -> Environments), which is what makes the approval step real.
# See docs/deployment/ci-cd.md for the secrets each environment needs and for the rollback procedure.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to (re)deploy, e.g. v2.1.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  verify-ci:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require a green CI gate for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          result=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --jq '[.check_runs[] | select(.name=="CI gate")][0].conclusion')
          echo "CI gate conclusion for $sha: $result"
          test "$result" = "success"

  build:
    name: Build and push images
    needs: verify-ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: API image (also used by the worker and scheduler)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://api:8000
            NEXT_PUBLIC_BROWSER_API_URL=${{ vars.PUBLIC_ORIGIN }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_ORIGIN }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          version: ${{ needs.build.outputs.version }}
          image-prefix: ${{ env.IMAGE_PREFIX }}
          public-origin: ${{ vars.PUBLIC_ORIGIN }}

  production:
    name: Deploy to production
    needs: [build, staging]
    runs-on: ubuntu-latest
    # The `production` environment requires reviewer approval: nothing reaches users without a human saying yes
    # after seeing staging pass its smoke test.
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          version: ${{ needs.build.outputs.version }}
          image-prefix: ${{ env.IMAGE_PREFIX }}
          public-origin: ${{ vars.PUBLIC_ORIGIN }}
