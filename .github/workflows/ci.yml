name: CI

# Every pull request, and every push to main, must pass all of these. Branch protection should require the
# "CI gate" job (see docs/deployment/ci-cd.md), which fails unless every job below succeeded.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, migrations, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_livescore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U football" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://football:football@localhost:5432/football_livescore
      REDIS_URL: redis://localhost:6379/0
      FOOTBALL_API_KEY: ci-placeholder
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install (runtime dependencies pinned to constraints.txt, plus test tooling)
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Migrations apply to an empty database and reach a single head
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" = "1"
      - name: Tests with coverage
        run: pytest -p no:cacheprovider --cov=app --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=${COVERAGE_FLOOR:-80}
        env:
          COVERAGE_FLOOR: "80"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/api/coverage.xml

  backend-security:
    name: Backend security (Bandit, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Bandit (fail on medium or high severity)
        run: bandit -r app -ll -q
      - name: pip-audit (the exact versions the image installs)
        run: pip-audit -r constraints.txt --no-deps --disable-pip

  web:
    name: Web (type-check, lint, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://api:8000
          NEXT_PUBLIC_BROWSER_API_URL: https://example.test
          NEXT_PUBLIC_SITE_URL: https://example.test
      - name: Production dependencies have no high or critical advisories
        run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (type-check, lint, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci
      - name: No critical advisories (high ones in the Expo/Jest toolchain are tracked in docs/security/accepted-risks.md)
        run: npm audit --audit-level=critical

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: >-
          semgrep scan --config p/python --config p/typescript --config p/secrets --metrics=off
          --severity ERROR --error apps/api/app apps/web/app apps/web/lib apps/web/components apps/web/proxy.ts apps/mobile/src

  images:
    name: Images (build, scan, production-config check, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: The production overlay refuses to start without its secrets
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q 2>/dev/null; then
            echo "production compose rendered with no secrets set"; exit 1
          fi

      - name: The production overlay renders with a complete environment
        run: |
          cp .env.production.example .env.production
          sed -i -E 's/^(POSTGRES_PASSWORD|REDIS_PASSWORD|JWT_SECRET|FOOTBALL_API_KEY|STRIPE_SECRET_KEY|BILLING_WEBHOOK_SECRET|S3_BUCKET|S3_ACCESS_KEY|S3_SECRET_KEY|GRAFANA_ADMIN_PASSWORD)=.*/\1=ci-placeholder-value-0123456789/' .env.production
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production config -q

      - name: Build images
        run: docker compose build api web

      - name: Trivy (fail on fixable high/critical vulnerabilities, secrets in layers)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: live-goal-api:latest
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy (web image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: live-goal-web:latest
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the stack
        run: docker compose up -d --wait postgres redis api worker web
        env:
          FOOTBALL_API_KEY: ci-placeholder
          FOOTBALL_API_BASE_URL: http://127.0.0.1:9

      - name: Smoke test
        run: |
          pip install -q httpx websockets
          python apps/api/scripts/smoke.py --base http://127.0.0.1:8000 --web http://127.0.0.1:3000 --wait 90

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  gate:
    name: CI gate
    if: always()
    needs: [backend, backend-security, web, mobile, secrets, sast, images]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; n=json.load(sys.stdin); bad={k:v['result'] for k,v in n.items() if v['result']!='success'}; print('failed:',bad) if bad else print('all green'); sys.exit(1 if bad else 0)"
