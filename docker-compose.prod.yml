# Production overlay (Phase 7).  Use WITH the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d
#
# What changes relative to the development stack:
#   * nginx is the only service reachable from outside; Postgres, Redis, the API and the web server
#     publish no host ports, and Prometheus/Grafana bind to loopback only
#   * every secret is REQUIRED (compose refuses to start if one is unset) -- no insecure defaults
#   * Redis is password protected, memory-capped, and never evicts the Celery queue
#   * ENVIRONMENT=production turns on the startup configuration checks (app/core/production_checks.py)
#   * MinIO is not started: production media lives in a real S3-compatible bucket
#
# Secrets belong in the platform's secret store or an untracked env file; see .env.production.example.

x-prod-env: &prod_env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-football_livescore}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 random characters)}
  BILLING_PROVIDER: ${BILLING_PROVIDER:-stripe}
  BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?set BILLING_WEBHOOK_SECRET}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
  FOOTBALL_API_KEY: ${FOOTBALL_API_KEY:?set FOOTBALL_API_KEY}
  CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://livepitch.example}
  ALLOWED_HOSTS: ${PUBLIC_HOST:?set PUBLIC_HOST, e.g. livepitch.example}
  PUBLIC_API_URL: ${PUBLIC_ORIGIN}
  BILLING_SUCCESS_URL: ${PUBLIC_ORIGIN}/premium?checkout=success
  BILLING_CANCEL_URL: ${PUBLIC_ORIGIN}/premium?checkout=cancelled
  MEDIA_STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
  # Only nginx (on the private Docker network) may vouch for a visitor's address.
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
  PUBLIC_SITE_URL: ${PUBLIC_ORIGIN}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  APP_VERSION: ${APP_VERSION:-}
  GIT_SHA: ${GIT_SHA:-}
  LOG_FORMAT: json

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped

  redis:
    ports: !reset []
    # volatile-lru: under memory pressure only keys that have a TTL (caches, rate-limit windows) are
    # evicted. The Celery queue is a TTL-less list, so it is never silently dropped.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped

  minio:
    profiles: ["local-only"]

  redis-exporter:
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped

  api:
    environment:
      <<: *prod_env
      SERVICE_NAME: api
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: !reset []
    healthcheck:
      # Liveness only: a database blip must restart nothing. Readiness is /health/ready (used by nginx
      # deploy checks and orchestrators), and /health reports every dependency for humans.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
    restart: unless-stopped

  worker:
    environment:
      <<: *prod_env
      METRICS_ROLE: worker
      SERVICE_NAME: worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2} --max-tasks-per-child=500
    restart: unless-stopped

  scheduler:
    environment:
      <<: *prod_env
      METRICS_ROLE: scheduler
      SERVICE_NAME: scheduler
    restart: unless-stopped

  web:
    build:
      args:
        # Server-side calls stay on the private network; the browser uses the one public origin.
        NEXT_PUBLIC_API_URL: http://api:8000
        NEXT_PUBLIC_BROWSER_API_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN}
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_BROWSER_API_URL: ${PUBLIC_ORIGIN}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_ORIGIN:?set PUBLIC_WS_ORIGIN, e.g. wss://livepitch.example}
    ports: !reset []
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/api_proxy.inc:/etc/nginx/api_proxy.inc:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0755  # request-body and proxy temp files; the root filesystem is read-only
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  prometheus:
    ports: !override
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    restart: unless-stopped
