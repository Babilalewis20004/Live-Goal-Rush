# Prometheus for the LivePitch stack (docker-compose `prometheus` service).
# The API's /metrics already merges the API, worker and scheduler counters (they push
# to Redis; see docs/architecture/observability.md), so one scrape target covers all
# three roles, distinguished by the `role` label.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
